<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 Formulario</title>
    <script defer src="./src/script/main.js"></script>
    <link rel="StyleSheet" href="./src/css/style.css">
</head>
<body>
    <header>

    </header>
    <main>
        <form id="formulario">
            <p>
                <label for="name">Name:</label>
                <input id="name" name="name" placeholder="Your Name" required>
            </p>
            
            <p>
                <label for="FirstName">First Name:</label>
                <input id="FirstName" name="FName" placeholder="Your First Name" required>
            </p>

            <p>
                <label for="dni">DNI:</label>
                <input id="dni" name="dni" placeholder="Your DNI" required>
            </p>

            <p>
                <label for="Phone">Phone:</label>
                <input id="Phone" name="Phone" placeholder="Your Phone number" required>
            </p>

            <p>
                <label for="email">Email:</label>
                <input id="email" name="email" placeholder="Your email" required>
            </p>

            <p>
                <label for="username">Username:</label>
                <input id="username" name="username" placeholder="Your username" required>
            </p>

            <input type="submit">
        </form>

        <p id="WhatHp"></p>
        
    </main>
    <footer>

    </footer>
</body>
</html>
