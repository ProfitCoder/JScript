<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crowdrise - Sign Up</title>
    <link rel="stylesheet" href="./src/css/style.css">
</head>
<body>
    <main class="register">
        <section class="illustration">
            <a href="#" class="logo">
                crowdrise
                <span>by gofundme</span>
            </a>

            <small class="copyright">© 2018 CrowdRise</small>
        </section>

        <section class="content">
            <button class="menu" type="button" aria-label="Open menu">
                ☰
            </button>

            <div class="form-container">
                <h1>Welcome to Crowdrise</h1>

                <p class="intro">
                    Let's get you all set up so you can verify your
                    nonprofit and begin setting up your first campaign!
                </p>

                <p class="login">
                    Already have an account? <a href="#">Log in.</a>
                </p>

                <form>
                    <div class="fields">
                        <div class="field">
                            <label for="firstName">First Name</label>
                            <input
                                type="text"
                                id="firstName"
                                name="firstName"
                                placeholder="Peter"
                                autocomplete="given-name"
                                required
                            >
                        </div>

                        <div class="field">
                            <label for="lastName">Last Name</label>
                            <input
                                type="text"
                                id="lastName"
                                name="lastName"
                                placeholder="Deltondo"
                                autocomplete="family-name"
                                required
                            >
                        </div>

                        <div class="field">
                            <label for="phone">Phone</label>
                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="949-867-5309"
                                autocomplete="tel"
                                required
                            >
                        </div>

                        <div class="field">
                            <label for="email">Email</label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="pdeltondo@crowdrise.com"
                                autocomplete="email"
                                required
                            >
                        </div>

                        <div class="field">
                            <label for="password">Password</label>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="************"
                                autocomplete="new-password"
                                required
                            >
                        </div>

                        <div class="field">
                            <label for="confirmPassword">Confirm Password</label>
                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="************"
                                autocomplete="new-password"
                                required
                            >
                        </div>
                    </div>

                    <div class="options">
                        <label class="checkbox">
                            <input type="checkbox" name="newsletter" checked>
                            <span>Yes, I want to receive Crowdrise's emails</span>
                        </label>

                        <label class="checkbox">
                            <input type="checkbox" name="terms" required checked>
                            <span>
                                I agree to the <a href="#">Terms</a>,
                                <a href="#">Privacy Policy</a> and
                                <a href="#">Fees</a>.
                            </span>
                        </label>
                    </div>

                    <button class="submit" type="submit">Sign Up</button>
                </form>

                <p class="fundraise">
                    Don't work for a nonprofit?
                    <a href="#">You can still fundraise for one.</a>
                </p>
            </div>

            <select class="language" aria-label="Language">
                <option value="en">English</option>
                <option value="es">Español</option>
            </select>
        </section>
    </main>
</body>
</html>
