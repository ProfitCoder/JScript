<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script defer src="./src/script/main.js"></script>
    <link rel="StyleSheet" href="./src/css/style.css">
</head>
<body>
    <h1>Welcome to the Calculator</h1>
    
    <ul>
        <li id="Solution"></li>
        <li><button id="plus">+</button></li>
        <li><button id="less">-</button></li>
        <li><button id="por">x</button></li>
        <li><button id="entre">÷</button></li>
        <li><button id="7">7</button></li>
        <li><button id="8">8</button></li>
        <li><button id="9">9</button></li>
        <li><button id="4">4</button></li>
        <li><button id="5">5</button></li>
        <li><button id="6">6</button></li>
        <li><button id="1">1</button></li>
        <li><button id="2">2</button></li>
        <li><button id="3">3</button></li>
        <li><button id="0">0</button></li>
        <li><button id="punto">.</button></li>
        <li><button id="C">C</button></li>
        <li><button id="SolutionBtn">=</button></li>
    </ul>
</body>
</html>
